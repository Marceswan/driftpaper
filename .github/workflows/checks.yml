name: Checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Core and desktop regression tests
        run: cargo test --locked -p flux -p flux-desktop
      - name: macOS package permission round-trip
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p test-package/DriftPaper.app/Contents/MacOS
          cp release/DriftPaper.app/Contents/Info.plist test-package/DriftPaper.app/Contents/
          printf '#!/bin/sh\nexit 0\n' > test-package/DriftPaper.app/Contents/MacOS/DriftPaper
          chmod 644 test-package/DriftPaper.app/Contents/MacOS/DriftPaper
          bash release/scripts/package-macos.sh test-package/DriftPaper.app test-package/DriftPaper.zip
  gpu:
    runs-on: ubuntu-latest
    env:
      DRIFTPAPER_REQUIRE_GPU_TESTS: '1'
      WGPU_BACKEND: vulkan
      XDG_RUNTIME_DIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan adapter
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Validate GPU pipelines and resize on Vulkan
        run: cargo test --locked -p flux -- --nocapture
      - name: Verify signing failure gates and cleanup
        run: python3 release/tests/test_macos_signing.py
